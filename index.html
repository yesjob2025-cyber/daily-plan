<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --paper:#F4F4F0;--card:#FFFFFF;--ink:#171C26;--soft:#69707E;--rule:#DFE3E8;--margin:#F0B7C4;
  --faith:#7B5FE0;--health:#2F9E77;--grow:#2F6FE8;--work:#DE922A;--mind:#E4658E;--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo",sans-serif;
  color:var(--ink);background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 8px;-webkit-font-smoothing:antialiased;padding-bottom:70px}
body::before{content:"";position:fixed;top:0;bottom:0;left:26px;width:1px;background:var(--margin);opacity:.5;pointer-events:none}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 0;position:relative}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:14px;color:var(--ink);display:grid;place-items:center}
.dhead{flex:1;text-align:center}
.dhead .d1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.dhead .d2{font-size:11.5px;color:var(--soft);margin-top:2px}
.tbtn{border:0;background:var(--ink);color:#fff;font:inherit;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;display:none}
.tbtn.show{display:inline-block}
.center{text-align:center;margin:-2px 0 12px}
.stage{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.stage .s1{display:flex;align-items:baseline;gap:8px}
.stage .lv{font-family:"Nanum Pen Script",cursive;font-size:24px;line-height:1}
.stage .nmx{font-size:15px;font-weight:700}
.stage .cntx{margin-left:auto;font-size:11px;opacity:.65}
.stage .s2{font-size:11.5px;opacity:.78;margin-top:5px;line-height:1.5}
.pbar{height:5px;border-radius:4px;margin-top:11px;display:flex;gap:2px}
.pbar b{flex:1;background:rgba(255,255,255,.22);border-radius:2px}
.pbar b.hit{background:#7BE3B4}
.stage .s3{display:flex;align-items:center;gap:8px;margin-top:10px}
.stage .s3 .txt{font-size:11px;opacity:.82;flex:1;line-height:1.45}
.up{border:0;background:#7BE3B4;color:#0C2D21;font:inherit;font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer}
.lvbtn{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;font:inherit;font-size:11px;padding:5px 9px;border-radius:9px;cursor:pointer;opacity:.8}
.week{display:flex;gap:5px;margin-bottom:14px}
.wd{flex:1;border:1px solid var(--rule);background:var(--card);border-radius:11px;padding:6px 2px;text-align:center;cursor:pointer}
.wd.sel{box-shadow:inset 0 0 0 1.5px var(--ink);border-color:var(--ink)}
.wd .l{font-size:10.5px;color:var(--soft);font-weight:600}
.wd.sun .l{color:var(--mind)}.wd.sat .l{color:var(--grow)}
.wd .n{font-size:12.5px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.wd .bar{height:20px;margin-top:5px;background:#EDEFF2;border-radius:4px;position:relative;overflow:hidden}
.wd .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-radius:4px}
.wd .bar .g{position:absolute;left:0;right:0;height:1px;background:#fff;opacity:.9}
.wd .s{font-size:9.5px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
.wd.win .s{color:var(--work);font-weight:700}
.score{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:12px}
.stop{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.big{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:12.5px;font-weight:600;color:var(--soft);margin-left:3px}
.state{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#EDEFF2;color:var(--soft)}
.state.g20{background:#E4F3EC;color:#1F7A5A}
.state.g30{background:#FFF0C9;color:#8A6D1F}
.track{height:10px;background:#EDEFF2;border-radius:6px;display:flex;position:relative}
.track i{height:100%}
.track i:first-child{border-radius:6px 0 0 6px}
.mark{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink);opacity:.35}
.marklab{position:relative;height:13px;margin-top:4px;font-size:9.5px;color:var(--soft)}
.marklab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.gauges{display:flex;gap:6px;margin-top:13px}
.gg{flex:1;text-align:center}
.gg .gl{font-size:10px;color:var(--soft);font-weight:600}
.gg .gv{font-size:11.5px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.gg .gb{height:4px;border-radius:3px;background:#EDEFF2;margin-top:4px;overflow:hidden}
.gg .gb i{display:block;height:100%;border-radius:3px;transition:width .4s ease}
.rew{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rew .tk{font-size:20px}
.rew .rt1{flex:1}
.rew .r1{font-size:13px;font-weight:700}
.rew .r2{font-size:10.5px;color:var(--soft);margin-top:2px}
.use{border:1px solid var(--rule);background:var(--card);border-radius:10px;font:inherit;font-size:11.5px;font-weight:600;padding:7px 11px;cursor:pointer;color:var(--ink)}
.use:disabled{opacity:.4;cursor:default}
.undo{border:0;background:none;font:inherit;font-size:10.5px;color:var(--soft);cursor:pointer;text-decoration:underline;padding:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:9px 2px 8px;cursor:pointer;text-align:center;font:inherit;color:var(--soft)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.zero{opacity:.45}
.tab .tl{font-size:12.5px;font-weight:700}
.tab .tc{font-size:10px;margin-top:2px;opacity:.85;font-variant-numeric:tabular-nums}
.tab.done .tl::after{content:" ✓";font-size:11px}
.block{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px 4px 8px}
.anchor{display:flex;align-items:baseline;gap:7px;padding:0 12px 12px}
.anchor .a1{font-family:"Nanum Pen Script",cursive;font-size:19px}
.anchor .a2{font-size:11px;color:var(--soft)}
.chain{position:relative}
.it{display:flex;align-items:stretch;border-radius:12px;position:relative}
.it.next{background:#FFF9E3}
.main{flex:1;display:flex;align-items:flex-start;gap:11px;background:none;border:0;padding:8px 6px 8px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:12px;min-width:0}
.main:focus-visible,.pen:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--soft);background:var(--card);z-index:1;font-variant-numeric:tabular-nums;transition:.2s}
.it.done .num{color:#fff}
.num svg{width:11px;height:11px}
.line{position:absolute;left:34px;width:1.5px;background:var(--rule);z-index:0}
.body{flex:1;min-width:0;padding-top:1px}
.nm{font-size:14px;line-height:1.4;padding:1px 2px;display:inline;
  background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;
  background-position:0 82%;background-size:0% 45%;transition:background-size .4s cubic-bezier(.5,0,.2,1),color .25s}
.it.done .nm{background-size:100% 45%}
.newtag{font-size:9.5px;font-weight:700;color:#1F5FA8;background:#DCEAFB;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
.exttag{font-size:9.5px;font-weight:700;color:#5A6474;background:#EDEFF2;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
.cnt{font-size:9.5px;font-weight:700;color:#1F5FA8;background:#EAF1FC;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
.note{font-size:11px;color:var(--soft);margin-top:2px;line-height:1.4}
.memo{font-size:11.5px;color:var(--ink);opacity:.72;margin-top:4px;line-height:1.45;border-left:2px solid var(--rule);padding-left:7px;white-space:pre-wrap;word-break:break-word}
.rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:2px}
.pt{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.min{font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
.pen{flex:0 0 auto;width:38px;border:0;border-left:1px dashed var(--rule);background:none;cursor:pointer;color:var(--soft);font-size:14px;border-radius:0 12px 12px 0}
.pen.has{color:var(--grow)}
.base::before{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:3px;height:15px;border-radius:2px;background:var(--ink);opacity:.22}
.nexttag{font-size:9.5px;font-weight:700;color:#8A6D1F;background:#FFEFBF;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
/* 링크 카드 */
.links{padding:0 12px 8px 45px;display:flex;flex-direction:column;gap:6px}
.lk{display:block;border:1px solid var(--rule);border-radius:11px;padding:9px 11px;text-decoration:none;color:inherit;background:#FBFBF9}
.lk:hover{border-color:var(--grow)}
.lk b{font-size:12.5px;display:block;line-height:1.35}
.lk span{font-size:11.5px;color:var(--soft);display:block;margin-top:3px;line-height:1.5}
.lk i{font-size:10px;color:var(--grow);font-style:normal;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--soft);font-size:12.5px;padding:14px 12px 20px;line-height:1.7}
.stamp{text-align:center;padding:12px 0 10px;font-family:"Nanum Pen Script",cursive;font-size:22px;color:var(--health)}
.nextup{font-size:11px;color:var(--soft);padding:2px 12px 10px;line-height:1.5}
.addx{margin:8px 12px 4px;width:calc(100% - 24px);padding:9px;border:1px dashed #C7CCD4;background:transparent;border-radius:11px;font:inherit;font-size:12px;color:var(--soft);cursor:pointer}
.addx:hover{border-color:var(--ink);color:var(--ink)}
.btnrow{display:flex;gap:7px;margin-top:11px}
.allbtn{flex:1;padding:12px 4px;border:1px dashed #C7CCD4;background:transparent;border-radius:var(--r);font:inherit;font-size:12px;color:var(--soft);cursor:pointer}
.allbtn:hover{border-color:var(--ink);color:var(--ink)}
.wsum{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;margin-top:11px;display:flex;gap:14px;justify-content:space-around;text-align:center}
.wsum div span{display:block;font-size:10.5px;color:var(--soft)}
.wsum div b{font-size:15px;font-variant-numeric:tabular-nums}
.foot{text-align:center;font-size:11px;color:var(--soft);padding:14px 0 0;line-height:1.7}
.sheet{position:fixed;inset:0;background:rgba(23,28,38,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.open{display:flex}
.sin{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.shead h2{font-size:16px;margin:0;font-weight:700}
.x{border:0;background:#EDEFF2;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
.ssub{font-size:11.5px;color:var(--soft);margin:0 0 14px;line-height:1.5}
.fl{font-size:11.5px;font-weight:700;color:var(--soft);margin:12px 0 5px}
textarea,input[type=text],input[type=url],input[type=number],select{width:100%;padding:11px;border:1px solid var(--rule);border-radius:12px;font:inherit;font-size:14px;background:#FCFCFB;color:var(--ink);line-height:1.55;resize:vertical}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--ink);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ent{border:1px solid var(--rule);border-radius:13px;padding:11px;margin-bottom:9px;background:#FAFAF8;position:relative}
.ent .eh{display:flex;align-items:center;margin-bottom:7px}
.ent .eh b{font-size:11.5px;color:var(--soft)}
.ent .eh button{margin-left:auto;border:0;background:none;color:#C0424F;font:inherit;font-size:11px;cursor:pointer;padding:2px 4px}
.ent input,.ent textarea{margin-bottom:7px;font-size:13.5px;padding:9px}
.ent input:last-of-type{margin-bottom:0}
.addent{width:100%;padding:11px;border:1px dashed #C7CCD4;background:transparent;border-radius:12px;font:inherit;font-size:12.5px;color:var(--soft);cursor:pointer;margin-top:2px}
.addent:hover{border-color:var(--ink);color:var(--ink)}
.save{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.del2{width:100%;margin-top:8px;border:0;background:none;font:inherit;font-size:11.5px;color:#C0424F;cursor:pointer;padding:6px}
.rc{border-bottom:1px solid #F0F1F3;padding:11px 0}
.rc:last-child{border:0}
.rc .rh{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.rc .rb{font-size:13px;line-height:1.55;margin-top:4px;white-space:pre-wrap}
.rc .rn{font-size:12px;color:var(--soft);margin-top:4px}
.rc .rd{font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums;margin-left:auto;font-weight:500}
.rc a.lk{margin-top:7px}
.copy{width:100%;margin-top:14px;padding:11px;border:1px solid var(--rule);background:var(--card);border-radius:12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.lvrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F0F1F3}
.lvrow .lvn{width:24px;height:24px;border-radius:50%;background:#EDEFF2;display:grid;place-items:center;font-size:11px;font-weight:700}
.lvrow.on .lvn{background:var(--ink);color:#fff}
.lvrow .lvt{flex:1}
.lvrow .lvt b{font-size:13px}
.lvrow .lvt span{display:block;font-size:11px;color:var(--soft);margin-top:2px}
.lvgo{border:1px solid var(--rule);background:var(--card);border-radius:9px;font:inherit;font-size:11px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.gh{margin-bottom:16px}
.ghh{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.ghh b{font-size:13px}
.ghh span{font-size:11px;color:var(--soft)}
.ghh i{margin-left:auto;font-size:11px;color:var(--soft);font-style:normal;font-variant-numeric:tabular-nums}
.gr{display:flex;align-items:center;gap:6px;padding:5px 0}
.gr .gn{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .cells{display:flex;gap:3px}
.cell{width:17px;height:17px;border-radius:5px;background:#EDEFF2}
.cell.na{background:transparent;border:1px dashed #E3E6EA}
.dayhdr{display:flex;gap:3px;justify-content:flex-end;font-size:9.5px;color:var(--soft);margin-bottom:2px}
.dayhdr span{width:17px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <button class="arrow" id="prev" aria-label="이전 날">‹</button>
    <div class="dhead"><div class="d1" id="d1"></div><div class="d2" id="d2"></div></div>
    <button class="arrow" id="next" aria-label="다음 날">›</button>
  </div>
  <div class="center"><button class="tbtn" id="goToday">오늘로</button></div>
  <div class="stage" id="stageCard"></div>
  <div class="week" id="week"></div>
  <div class="score">
    <div class="stop"><div class="big" id="pt"></div><div class="state" id="state"></div></div>
    <div class="track" id="track"></div>
    <div class="marklab"><span id="m20"></span><span id="m30"></span></div>
    <div class="gauges" id="gauges"></div>
  </div>
  <div class="rew">
    <span class="tk">🎟</span>
    <div class="rt1"><div class="r1" id="rew1"></div><div class="r2" id="rew2"></div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <button class="use" id="useBtn">보상 쓰기</button>
      <button class="undo" id="undoBtn" style="display:none">사용 취소</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <div class="btnrow">
    <button class="allbtn" id="statBtn">영역별 현황</button>
    <button class="allbtn" id="allBtn">오늘 기록</button>
    <button class="allbtn" id="ideaBtn">글감 서랍</button>
  </div>
  <div class="wsum" id="wsum"></div>
  <p class="foot">이미 하고 있는 것은 1점, 새로 붙이는 것은 3점<br>기타로 추가한 일은 보너스 2점입니다</p>
</div>

<div class="sheet" id="sheet">
  <div class="sin">
    <div class="shead"><h2 id="shTitle"></h2><button class="x" id="shClose" aria-label="닫기">×</button></div>
    <p class="ssub" id="shSub"></p>
    <div id="shFields"></div>
    <button class="save" id="shSave">저장하고 체크</button>
    <button class="del2" id="shDel">기록 전체 지우기</button>
  </div>
</div>
<div class="sheet" id="sheet2">
  <div class="sin">
    <div class="shead"><h2 id="s2Title"></h2><button class="x" id="s2Close" aria-label="닫기">×</button></div>
    <p class="ssub" id="s2Sub"></p>
    <div id="s2Body"></div>
    <button class="copy" id="s2Copy">전체 복사</button>
  </div>
</div>
<div class="sheet" id="sheet3">
  <div class="sin">
    <div class="shead"><h2>단계</h2><button class="x" id="s3Close" aria-label="닫기">×</button></div>
    <p class="ssub">천천히 올라가세요. 내려가도 괜찮습니다.</p>
    <div id="s3Body"></div>
  </div>
</div>
<div class="sheet" id="sheet4">
  <div class="sin">
    <div class="shead"><h2 id="s4Title">기타 추가</h2><button class="x" id="s4Close" aria-label="닫기">×</button></div>
    <p class="ssub">계획에 없던 일을 남겨두세요. 보너스 2점이 붙습니다.</p>
    <div class="fl">무엇을 했나요</div>
    <input type="text" id="xName" placeholder="예: 거래처 미팅 준비" maxlength="30">
    <div class="g2" style="margin-top:10px">
      <div><div class="fl" style="margin-top:0">영역</div><select id="xArea"></select></div>
      <div><div class="fl" style="margin-top:0">시간(분)</div><input type="number" id="xMin" value="20" min="1" max="600"></div>
    </div>
    <button class="save" id="xSave">추가하기</button>
  </div>
</div>
<div class="sheet" id="sheet5">
  <div class="sin">
    <div class="shead"><h2>영역별 현황</h2><button class="x" id="s5Close" aria-label="닫기">×</button></div>
    <p class="ssub" id="s5Sub"></p>
    <div id="s5Body"></div>
  </div>
</div>

<script>
const A={신앙:'#7B5FE0',건강:'#2F9E77',성장:'#2F6FE8',업무:'#DE922A',마음:'#E4658E'};
const GROUP={신앙:'영성',건강:'운동',성장:'성장',업무:'일',마음:'성장'};
const GC={영성:'#7B5FE0',운동:'#2F9E77',일:'#DE922A',성장:'#2F6FE8'};

const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function autoTab(){const d=new Date(),m=d.getHours()*60+d.getMinutes();
  if(m<8*60+30)return 0;if(m<11*60+30)return 1;if(m<18*60)return 2;return 3}
function blocksOf(d){
  const p=PLAN[d.getDay()],o={},w=d.getDay(),key=dk(d),ex=ST.extra[key]||{};
  BLOCKS.forEach(b=>{
    const base=(p[b.id]||[]).filter(x=>x.s<=ST.stage&&(!x.d||x.d.includes(w)))
      .map(x=>({...x,id:w+'-'+b.id+'-'+x.n}));
    const extras=(ex[b.id]||[]).map(x=>({...x,p:2,s:0,extra:true,rec:R_ETC,id:x.id}));
    o[b.id]=base.concat(extras);
  });
  return o;
}
const doneOf=k=>ST.log[k]||[];
const recOf=(k,id)=>(ST.rec[k]||{})[id];
function isList(v){return Array.isArray(v)&&v.length&&typeof v[0]==='object'}
function recText(v){
  if(isList(v))return v.map(e=>'· '+(e.t||e.s||'')).join('\n');
  return Array.isArray(v)?v.filter(Boolean).join('\n'):(v||'');
}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};

function scoreOf(date){
  const done=doneOf(dk(date)),all=BLOCKS.flatMap(b=>blocksOf(date)[b.id]);
  const got={영성:0,운동:0,일:0,성장:0},max={영성:0,운동:0,일:0,성장:0};
  all.forEach(x=>{const g=GROUP[x.a];if(!x.extra)max[g]+=x.p;if(done.includes(x.id))got[g]+=x.p});
  const total=GKEYS.reduce((s,g)=>s+got[g],0),full=GKEYS.reduce((s,g)=>s+max[g],0);
  return {got,max,total,full,goal:Math.max(1,Math.round(full*.7)),bonus:Math.max(2,Math.round(full*.9)),all,done};
}
function last7(){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
  const s=scoreOf(d);out.push({hit:s.total>0&&s.total>=s.goal})}return out}
function tickets(){let e=0;Object.keys(ST.log).forEach(k=>{const s=scoreOf(new Date(k));if(s.total>0&&s.total>=s.bonus)e++});
  return {earned:e,left:Math.max(0,e-ST.used)}}
function toggle(id){const k=dk(cur),a=doneOf(k).slice(),i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.push(id);ST.log[k]=a;persist();render()}
function check(id){const k=dk(cur),a=doneOf(k).slice();if(!a.includes(id)){a.push(id);ST.log[k]=a}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}

function entRow(e){
  const r=editing.rec,d=document.createElement('div');d.className='ent';
  d.innerHTML=`<div class="eh"><b>항목</b><button type="button">지우기</button></div>

    <input type="url" class="e-u" placeholder="${esc(r.ph[2])}" value="${esc(e.u||'')}">`;
  d.querySelector('button').onclick=()=>d.remove();
  return d;
}
function openRec(item){
  editing=item;const k=dk(cur),v=recOf(k,item.id),r=item.rec;
  document.getElementById('shTitle').textContent=r.t;
  document.getElementById('shSub').textContent=`${item.n} · ${cur.getMonth()+1}월 ${cur.getDate()}일`;
  const box=document.getElementById('shFields');box.innerHTML='';
  if(r.list){
    const list=document.createElement('div');box.appendChild(list);
    const arr=isList(v)?v:[];
    (arr.length?arr:[{}]).forEach(e=>list.appendChild(entRow(e)));
    const add=document.createElement('button');add.className='addent';add.type='button';
    add.textContent='+ '+(r.add||'항목 추가');
    add.onclick=()=>{list.appendChild(entRow({}));list.lastChild.querySelector('.e-t').focus()};
    box.appendChild(add);
  }else if(r.f){
    r.f.forEach((f,i)=>{box.innerHTML+=`<div class="fl">${f}</div><input type="text" class="fin" value="${esc(Array.isArray(v)&&v[i]?v[i]:'')}">`});
  }else{
    box.innerHTML=`<textarea class="fin" rows="6" placeholder="${esc(r.ph||'')}">${esc(typeof v==='string'?v:'')}</textarea>`;
  }
  document.getElementById('shDel').style.display=v?'block':'none';
  sheet.classList.add('open');
  setTimeout(()=>{const f=box.querySelector('.fin,.e-t');if(f)f.focus()},80);
}
document.getElementById('shClose').onclick=()=>sheet.classList.remove('open');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
document.getElementById('shSave').onclick=()=>{
  const k=dk(cur),r=editing.rec,box=document.getElementById('shFields');
  let v,has;
  if(r.list){
    v=[...box.querySelectorAll('.ent')].map(d=>({
      t:d.querySelector('.e-t').value.trim(),
      s:d.querySelector('.e-s').value.trim(),
      u:d.querySelector('.e-u').value.trim()
    })).filter(e=>e.t||e.s||e.u);
    has=v.length>0;
  }else if(r.f){
    v=[...box.querySelectorAll('.fin')].map(x=>x.value.trim());has=v.some(Boolean);
  }else{v=box.querySelector('.fin').value.trim();has=!!v}
  ST.rec[k]=ST.rec[k]||{};
  if(has){ST.rec[k][editing.id]=v;check(editing.id)}else delete ST.rec[k][editing.id];
  persist();sheet.classList.remove('open');render();
};
document.getElementById('shDel').onclick=()=>{const k=dk(cur);if(ST.rec[k])delete ST.rec[k][editing.id];

  const body=document.getElementById('s2Body');body.innerHTML='';
  const keys=Object.keys(ST.rec).sort().reverse();let n=0;copyText='글감 서랍\n\n';
  keys.forEach(day=>{Object.keys(ST.rec[day]).forEach(id=>{
    if(!id.endsWith(IDEA_NAME))return;
    const v=ST.rec[day][id];if(!v)return;n++;
    const f=R_IDEA.f;let inner='';
    f.forEach((lab,i)=>{if(v[i])inner+=`<div class="rn"><b style="color:var(--ink)">${lab}</b> — ${esc(v[i])}</div>`});
    const t=Array.isArray(v)&&v[0]?v[0]:'(제목 없음)';
    body.innerHTML+=`<div class="rc"><div class="rh"><span style="width:7px;height:7px;border-radius:50%;background:${A['성장']};display:inline-block"></span>${esc(t)}<span class="rd">${day.slice(5)}</span></div>${inner}</div>`;
    copyText+=`[${day}] ${t}\n`;f.forEach((lab,i)=>{if(v[i])copyText+=`- ${lab}: ${v[i]}\n`});copyText+='\n';
  })});
  document.getElementById('s2Sub').textContent=n?`모인 글감 ${n}개 · 최근 것부터`:'';
  if(!n)body.innerHTML='<div class="empty">아직 모인 글감이 없습니다.<br>저녁에 한 꼭지만 남겨보세요.</div>';
  sheet2.classList.add('open');
};
document.getElementById('s2Copy').onclick=()=>{
  const b=document.getElementById('s2Copy');
  try{navigator.clipboard.writeText(copyText);b.textContent='복사했습니다 ✓';setTimeout(()=>b.textContent='전체 복사',1500)}catch(e){b.textContent='복사 실패'}
};

/* 영역별 현황 */
const sheet5=document.getElementById('sheet5');
document.getElementById('s5Close').onclick=()=>sheet5.classList.remove('open');
sheet5.onclick=e=>{if(e.target===sheet5)sheet5.classList.remove('open')};
document.getElementById('statBtn').onclick=()=>{
  const days=[];for(let i=6;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-i);days.push(d)}
  const rows={};
  days.forEach((d,idx)=>{
    const done=doneOf(dk(d));
    BLOCKS.forEach(b=>blocksOf(d)[b.id].forEach(x=>{
      const key=x.extra?'기타 — '+x.n:x.n;
      rows[key]=rows[key]||{a:x.a,cells:Array(7).fill(null)};
      rows[key].cells[idx]=done.includes(x.id);
    }));
  });
  const body=document.getElementById('s5Body');body.innerHTML='';
  const hdr=`<div class="dayhdr">${days.map(d=>`<span>${DAYS[d.getDay()]}</span>`).join('')}</div>`;
  GKEYS.forEach(g=>{
    const names=Object.keys(rows).filter(n=>GROUP[rows[n].a]===g);
    if(!names.length)return;
    let done=0,plan=0;
    names.forEach(n=>rows[n].cells.forEach(c=>{if(c!==null){plan++;if(c)done++}}));
    let html=`<div class="gh"><div class="ghh"><b style="color:${GC[g]}">${g}</b>
      <span>${names.length}개 항목</span><i>7일 ${done}/${plan}회</i></div>${hdr}`;
    names.forEach(n=>{
      html+=`<div class="gr"><span class="gn">${esc(n)}</span><span class="cells">`;
      rows[n].cells.forEach(c=>{
        html+=c===null?'<span class="cell na"></span>'
          :c?`<span class="cell" style="background:${GC[g]}"></span>`:'<span class="cell"></span>';
      });
      html+='</span></div>';
    });
    body.innerHTML+=html+'</div>';
  });
  document.getElementById('s5Sub').textContent=
    `${days[0].getMonth()+1}/${days[0].getDate()} ~ ${days[6].getMonth()+1}/${days[6].getDate()} · 색이 찬 칸이 해낸 날`;
  if(!Object.keys(rows).length)body.innerHTML='<div class="empty">표시할 항목이 없습니다.</div>';
  sheet5.classList.add('open');
};

/* 단계 */
const sheet3=document.getElementById('sheet3');
document.getElementById('s3Close').onclick=()=>sheet3.classList.remove('open');
sheet3.onclick=e=>{if(e.target===sheet3)sheet3.classList.remove('open')};
function openStages(){
  const body=document.getElementById('s3Body');body.innerHTML='';
  STAGES.forEach((s,i)=>{
    const lv=i+1,row=document.createElement('div');
    row.className='lvrow'+(lv===ST.stage?' on':'');
    row.innerHTML=`<div class="lvn">${lv}</div><div class="lvt"><b>${s.n}</b><span>${s.d}</span></div>`;
    const btn=document.createElement('button');btn.className='lvgo';
    btn.textContent=lv===ST.stage?'현재':'이 단계로';btn.disabled=lv===ST.stage;
    btn.onclick=()=>{ST.stage=lv;persist();sheet3.classList.remove('open');render()};
    row.appendChild(btn);body.appendChild(row)});
  sheet3.classList.add('open');
}

function render(){
  const k=dk(cur),bl=blocksOf(cur),S=scoreOf(cur);
  document.getElementById('d1').textContent=`${cur.getMonth()+1}월 ${cur.getDate()}일 ${DAYS[cur.getDay()]}요일`;
  document.getElementById('d2').textContent=DAYNOTE[cur.getDay()];
  document.getElementById('goToday').classList.toggle('show',k!==TODAY);

  const L=last7(),hits=L.filter(x=>x.hit).length,st=STAGES[ST.stage-1];
  const cntToday=BLOCKS.flatMap(b=>bl[b.id]).length;
  const canUp=hits>=5&&ST.stage<STAGES.length;
  const card=document.getElementById('stageCard');
  card.innerHTML=
    `<div class="s1"><span class="lv">${ST.stage}단계</span><span class="nmx">${st.n}</span><span class="cntx">오늘 ${cntToday}개</span></div>
     <div class="s2">${st.d}</div>
     <div class="pbar">${L.map(x=>`<b class="${x.hit?'hit':''}"></b>`).join('')}</div>
     <div class="s3"><span class="txt">최근 7일 중 <b>${hits}일</b> 목표 달성${canUp?' · 다음 단계 조건 충족!':' · 5일이 되면 다음 단계'}</span>
       ${canUp?'<button class="up" id="upBtn">다음 단계로</button>':'<button class="lvbtn" id="lvBtn">단계 보기</button>'}</div>`;
  if(canUp)document.getElementById('upBtn').onclick=()=>{ST.stage++;persist();render()};
  else document.getElementById('lvBtn').onclick=openStages;

  const wk=document.getElementById('week');wk.innerHTML='';
  const base=new Date(cur);base.setDate(base.getDate()-((base.getDay()+6)%7));
  let wsum=0,wcnt=0,w20=0,w30=0;
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    const kk=dk(d),s=scoreOf(d),sc=ST.log[kk]?s.total:0;
    if(ST.log[kk]){wsum+=sc;wcnt++;if(sc>=s.goal)w20++;if(sc>=s.bonus)w30++}
    const el=document.createElement('div');
    el.className='wd'+(kk===k?' sel':'')+(d.getDay()===0?' sun':'')+(d.getDay()===6?' sat':'')+(sc>0&&sc>=s.bonus?' win':'');
    el.innerHTML=`<div class="l">${DAYS[d.getDay()]}</div><div class="n">${d.getDate()}</div>
      <div class="bar"><i style="height:${s.full?Math.min(100,sc/s.full*100):0}%"></i><div class="g" style="bottom:${s.full?s.goal/s.full*100:0}%"></div></div>
      <div class="s">${sc||'–'}</div>`;
    el.onclick=()=>{cur=d;if(dk(d)===TODAY)tab=autoTab();render()};
    wk.appendChild(el);
  }

  document.getElementById('pt').innerHTML=`${S.total}<small>/ ${S.full}점</small>`;
  const stx=document.getElementById('state');
  stx.className='state'+(S.total>=S.bonus?' g30':S.total>=S.goal?' g20':'');
  stx.textContent=S.total>=S.bonus?'보상 획득 🎟':S.total>=S.goal?'목표 달성':`목표까지 ${S.goal-S.total}점`;
  const tr=document.getElementById('track');tr.innerHTML='';
  GKEYS.forEach(g=>{if(!S.got[g])return;const i=document.createElement('i');
    i.style.width=Math.min(100,S.got[g]/S.full*100)+'%';i.style.background=GC[g];tr.appendChild(i)});
  [S.goal,S.bonus].forEach(v=>{const m=document.createElement('div');m.className='mark';m.style.left=(v/S.full*100)+'%';tr.appendChild(m)});
  const l20=document.getElementById('m20'),l30=document.getElementById('m30');
  l20.textContent=`${S.goal} 목표`;l20.style.left=(S.goal/S.full*100)+'%';
  l30.textContent=`${S.bonus} 보상`;l30.style.left=(S.bonus/S.full*100)+'%';

  const gg=document.getElementById('gauges');gg.innerHTML='';
  GKEYS.forEach(g=>{const v=S.got[g],mx=S.max[g];
    gg.innerHTML+=`<div class="gg"><div class="gl">${g}</div>
      <div class="gv" style="color:${mx&&v>=mx?GC[g]:'var(--ink)'}">${v}<span style="color:var(--soft);font-weight:600">/${mx}</span></div>
      <div class="gb"><i style="width:${mx?Math.min(100,v/mx*100):0}%;background:${GC[g]}"></i></div></div>`});

  const T=tickets();
  document.getElementById('rew1').textContent=T.left?`쓸 수 있는 보상 ${T.left}개`:'보상 없음';
  document.getElementById('rew2').textContent=`보상선 넘은 날 ${T.earned}일 · 사용 ${ST.used}개`;
  document.getElementById('useBtn').disabled=!T.left;
  document.getElementById('undoBtn').style.display=ST.used>0?'block':'none';

  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  BLOCKS.forEach((b,i)=>{const it=bl[b.id],d2=it.filter(x=>S.done.includes(x.id)).length;
    const el=document.createElement('button');
    el.className='tab'+(i===tab?' on':'')+(it.length&&d2===it.length?' done':'')+(!it.length?' zero':'');
    el.innerHTML=`<div class="tl">${b.id}</div><div class="tc">${it.length?d2+'/'+it.length:'—'}</div>`;
    el.onclick=()=>{tab=i;render()};tabs.appendChild(el)});

  const b=BLOCKS[tab],items=bl[b.id],panel=document.getElementById('panel');
  panel.innerHTML='';
  const sec=document.createElement('section');sec.className='block';
  sec.innerHTML=`<div class="anchor"><span class="a1">${b.anchor}</span><span class="a2">${b.hint}</span></div>`;
  if(!items.length){
    sec.innerHTML+='<div class="empty">이 시간엔 아직 아무것도 없습니다.<br>기타로 오늘 한 일을 남겨보세요.</div>';
  }else{
    const chain=document.createElement('div');chain.className='chain';
    const nextIdx=items.findIndex(x=>!S.done.includes(x.id));
    items.forEach((x,i)=>{
      const on=S.done.includes(x.id),c=A[x.a],memo=recOf(k,x.id),lst=isList(memo);
      const row=document.createElement('div');
      row.className='it'+(on?' done':'')+(i===nextIdx?' next':'')+(x.s===0&&!x.extra?' base':'');
      const btn=document.createElement('button');btn.className='main';btn.setAttribute('aria-pressed',on);
      btn.innerHTML=
       `<span class="num" style="${on?`background:${c};border-color:${c}`:''}">${on?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.3L20 6.6"/></svg>':(i+1)}</span>
        <span class="body">
          <span class="nm" style="color:${on?c:'var(--ink)'};opacity:${on?'.8':'1'}">${esc(x.n)}</span>${lst?`<span class="cnt">${memo.length}건</span>`:''}${x.extra?'<span class="exttag">기타</span>':''}${x.s===ST.stage&&!x.extra?'<span class="newtag">새로</span>':''}${i===nextIdx?'<span class="nexttag">다음</span>':''}
          ${x.note?`<span class="note">${x.note}</span>`:''}
          ${memo&&!lst?`<span class="memo">${esc(recText(memo))}</span>`:''}
        </span>
        <span class="rt"><span class="pt" style="color:${on?c:'var(--ink)'}">${x.extra?'+':''}${x.p}점</span><span class="min">${x.m}분</span></span>`;
      btn.onclick=()=>toggle(x.id);row.appendChild(btn);
      if(x.rec){const pen=document.createElement('button');pen.className='pen'+(memo?' has':'');
        pen.textContent='✎';pen.setAttribute('aria-label',x.n+' 기록');pen.onclick=()=>openRec(x);row.appendChild(pen)}
      if(x.extra){const del=document.createElement('button');del.className='pen';del.textContent='✕';
        del.setAttribute('aria-label','삭제');del.onclick=()=>delExtra(b.id,x.id);row.appendChild(del)}
      chain.appendChild(row);
      if(lst){const lw=document.createElement('div');lw.className='links';
        lw.innerHTML=memo.map(lkHTML).join('');chain.appendChild(lw)}
    });
    const line=document.createElement('div');line.className='line';line.style.top='22px';line.style.bottom='22px';
    chain.appendChild(line);sec.appendChild(chain);
    if(nextIdx===-1)sec.innerHTML+='<div class="stamp">이 블록 끝 ✓</div>';
  }
  const add=document.createElement('button');
  add.className='addx';add.textContent=`+ ${b.id}에 기타 추가`;
  add.onclick=()=>openAdd(b.id);
  sec.appendChild(add);
  if(ST.stage<STAGES.length){
    const w=cur.getDay();
    const nx=(PLAN[w][b.id]||[]).filter(x=>x.s===ST.stage+1&&(!x.d||x.d.includes(w))).map(x=>x.n);
    if(nx.length){const p2=document.createElement('div');p2.className='nextup';
      p2.textContent=`${ST.stage+1}단계에서 열림 — ${nx.join(', ')}`;sec.appendChild(p2)}
  }
  panel.appendChild(sec);

  document.getElementById('wsum').innerHTML=
    `<div><span>이번 주 평균</span><b>${wcnt?Math.round(wsum/wcnt*10)/10:'–'}</b></div>
     <div><span>목표 넘은 날</span><b>${w20}일</b></div>
     <div><span>보상 받은 날</span><b>${w30}일</b></div>`;
}

document.getElementById('prev').onclick=()=>{cur.setDate(cur.getDate()-1);render()};
document.getElementById('next').onclick=()=>{cur.setDate(cur.getDate()+1);render()};
document.getElementById('goToday').onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);tab=autoTab();render()};
document.getElementById('useBtn').onclick=()=>{ST.used++;persist();render()};
document.getElementById('undoBtn').onclick=()=>{ST.used=Math.max(0,ST.used-1);persist();render()};
(async()=>{const s=await Store.load();if(s&&s.log){ST=Object.assign(ST,s);ST.rec=ST.rec||{};ST.extra=ST.extra||{};ST.stage=ST.stage||1}render()})();
</script>
</body>
</html>
